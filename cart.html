<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Kishore Store</title>
<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header { background:#007bff; color:white; text-align:center; padding:20px;}
.cart-item { display:flex; align-items:center; gap:15px; margin:10px; background:#fff; padding:10px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.cart-item img { width:80px; height:80px; object-fit:cover; border-radius:5px; border:1px solid #ddd;}
.cart-details { flex:1; }
.cart-details b { font-size:16px; }
.cart-details button { margin:3px; padding:4px 8px; border:none; border-radius:4px; background:#007bff; color:white; cursor:pointer;}
.cart-details button:hover { background:#0056b3; }
#checkout-btn { margin-top:15px; padding:10px 15px; background:green; color:white; border:none; cursor:pointer; border-radius:5px; font-size:15px;}
#checkout-btn:disabled { background:gray; cursor:not-allowed; }
</style>
</head>
<body>

<header><h1>My Cart</h1></header>

<div id="cart-items"></div>
<h3>Total: ₹<span id="cart-total">0</span></h3>
<button id="checkout-btn">Proceed to Checkout</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart"))||[];
const cartItems = document.getElementById("cart-items");
const cartTotal = document.getElementById("cart-total");

function renderCart(){
  cartItems.innerHTML="";
  if(cart.length===0){ cartItems.innerHTML="<p>Your cart is empty.</p>"; cartTotal.innerText=0; document.getElementById("checkout-btn").disabled=true; return;}
  let total=0;
  cart.forEach((item,index)=>{
    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <img src="${item.image}" alt="${item.name}">
      <div class="cart-details">
        <b>${item.name}</b><br>
        ₹${item.price} × ${item.qty} = ₹${item.price*item.qty}<br>
        <button onclick="decreaseQty(${index})">−</button>
        <button onclick="increaseQty(${index})">+</button>
        <button onclick="removeItem(${index})" style="background:red;">Remove</button>
      </div>
    `;
    cartItems.appendChild(div);
    total+=item.price*item.qty;
  });
  cartTotal.innerText=total.toLocaleString();
  document.getElementById("checkout-btn").disabled=false;
}

function saveCart(){ localStorage.setItem("cart",JSON.stringify(cart)); }
function removeItem(index){ cart.splice(index,1); saveCart(); renderCart(); }
function increaseQty(index){ cart[index].qty+=1; saveCart(); renderCart(); }
function decreaseQty(index){ if(cart[index].qty>1) cart[index].qty-=1; else cart.splice(index,1); saveCart(); renderCart(); }

document.getElementById("checkout-btn").addEventListener("click",()=>{ if(cart.length>0) window.location.href="checkout.html"; });

renderCart();
</script>
</body>
</html>
