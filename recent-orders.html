<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent Orders</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
  nav { padding: 15px; text-align: center; background: #007bff; }
  nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
  nav a:hover { text-decoration: underline; }
  h1 { text-align: center; margin: 20px 0; }
  #orders-container { max-width: 1000px; margin: 0 auto 50px; padding: 10px; }
  .order { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .order h3 { margin: 0 0 10px 0; }
  .order ul { padding-left: 20px; margin: 0 0 10px 0; }
  .order strong { display: block; margin-top: 5px; color: #28a745; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a> |
  <a href="cart.html">Cart</a> |
  <a href="recent-orders.html">My Orders</a>
</nav>

<h1>📜 My Orders</h1>
<div id="orders-container"></div>

<script>
  const ordersContainer = document.getElementById("orders-container");
  const orders = JSON.parse(localStorage.getItem("orders")) || [];

  if (orders.length === 0) {
    ordersContainer.innerHTML = "<p style='text-align:center;'>No recent orders.</p>";
  } else {
    // Display orders from latest to oldest
    orders.slice().reverse().forEach((order, index) => {
      const div = document.createElement("div");
      div.classList.add("order");

      let itemsHtml = "";
      order.items.forEach(item => {
        const qty = item.qty || 1;
        itemsHtml += `<li>${item.name} - ₹${item.price.toLocaleString()} x ${qty}</li>`;
      });

      div.innerHTML = `
        <h3>Order #${orders.length - index} - ${order.date}</h3>
        <ul>${itemsHtml}</ul>
        <strong>Total: ₹${order.total.toLocaleString()}</strong>
        <p>Shipping Address: ${order.address}</p>
      `;
      ordersContainer.appendChild(div);
    });
  }
</script>

</body>
</html>
