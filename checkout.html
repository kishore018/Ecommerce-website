<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Kishore Store</title>
<style>
body { font-family: Arial; background:#f5f5f5; margin:0; padding:0; }
header { background:#007bff; color:white; text-align:center; padding:20px;}
.container { max-width:500px; margin:30px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.2);}
input, textarea { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; font-size:16px; }
button { width:100%; padding:12px; background:green; color:white; font-size:16px; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#006400; }
.order-summary { background:#f0f0f0; padding:10px; margin:10px 0; border-radius:5px; }
</style>
</head>
<body>
<header><h1>Checkout</h1></header>
<div class="container">
<h2>Enter Your Address</h2>
<form id="checkout-form">
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="tel" id="phone" placeholder="Phone Number" required>
  <textarea id="address" placeholder="Address" rows="4" required></textarea>
  <h3>Order Summary</h3>
  <div id="order-summary" class="order-summary"></div>
  <button type="submit">Place Order</button>
</form>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart"))||[];
if(cart.length===0){ alert("Cart is empty!"); window.location.href="index.html"; }
const summaryDiv=document.getElementById("order-summary");
let total=0;
cart.forEach(item=>{
  const div=document.createElement("div");
  div.innerText=`${item.name} - ₹${item.price} × ${item.qty} = ₹${item.price*item.qty}`;
  summaryDiv.appendChild(div);
  total+=item.price*item.qty;
});
const totalDiv=document.createElement("div"); totalDiv.style.fontWeight="bold"; totalDiv.innerText="Total: ₹"+total.toLocaleString();
summaryDiv.appendChild(totalDiv);

document.getElementById("checkout-form").addEventListener("submit",function(e){
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();
  if(!name||!phone||!address){ alert("Please fill all fields!"); return; }

  let orders=JSON.parse(localStorage.getItem("orders"))||[];
  orders.push({date:new Date().toLocaleString(), items:cart, total:total, customer:{name,phone,address}});
  localStorage.setItem("orders",JSON.stringify(orders));
  localStorage.setItem("cart",JSON.stringify([]));
  window.location.href="success.html";
});
</script>
</body>
</html>
